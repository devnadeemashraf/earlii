# Task runner (https://taskfile.dev). Task's built-in shell works the same on Windows, macOS and Linux.
# Run `task --list` to see everything. `task check` is exactly what CI runs.
version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install pinned tools, dependencies and git hooks, then run doctor
    cmds:
      - mise install
      - pnpm install
      - lefthook install
      - task: doctor

  doctor:
    desc: Check every tool against the pins in mise.toml
    cmds:
      - node scripts/doctor.mjs

  check:
    desc: Everything CI runs (lint, the production web build, then tests)
    cmds:
      - task: lint
      # Before test: Vitest regenerates the route tree, which would hide a stale committed one.
      - task: build:web
      - task: test

  fmt:
    desc: Format all code
    cmds:
      - pnpm exec biome check --write .
      - task: fmt:go

  fmt:go:
    desc: Format Go code (gofumpt + goimports via golangci-lint)
    cmds:
      - |
        if [ -f go.work ]; then
          for d in $(go list -m -f '{{"{{"}}.Dir{{"}}"}}'); do (cd "$d" && golangci-lint fmt); done
        else
          echo "skip: no Go modules yet (P0-02)"
        fi

  lint:
    desc: All linters
    cmds:
      - task: lint:text
      - task: lint:ts
      - task: lint:types
      - task: lint:go
      - task: lint:sql
      - task: lint:migrations
      - task: lint:actions
      - task: lint:secrets

  lint:ts:
    desc: Biome format + lint + import order check (read-only)
    cmds:
      - pnpm exec biome ci .

  lint:text:
    desc: Reject banned characters (the section sign) in every tracked file
    cmds:
      - node scripts/check-text.mjs

  lint:types:
    desc: Typecheck every TS app and package (tsc -p)
    cmds:
      - |
        found=0
        for f in apps/*/tsconfig.json packages/*/tsconfig.json; do
          if [ -f "$f" ]; then found=1; node node_modules/typescript/bin/tsc -p "$f"; fi
        done
        if [ "$found" = 0 ]; then echo "skip: no TS apps or packages yet (P0-03); the alias fixture is typechecked in test:scripts"; fi

  lint:go:
    desc: golangci-lint (includes formatter checks)
    cmds:
      - golangci-lint config verify
      - |
        if [ -f go.work ]; then
          for d in $(go list -m -f '{{"{{"}}.Dir{{"}}"}}'); do (cd "$d" && golangci-lint run ./...); done
        else
          echo "skip: no Go modules yet (P0-02)"
        fi

  lint:sql:
    desc: Fail if backend/gen/db is stale or a query doesn't compile (sqlc diff)
    cmds:
      - sqlc diff -f backend/sqlc.yaml

  lint:migrations:
    desc: Forward-only migrations (ADR-0005)
    cmds:
      - node scripts/check-migrations.mjs

  lint:actions:
    desc: Lint GitHub Actions workflows for errors (actionlint) and security issues (zizmor)
    cmds:
      - actionlint
      - zizmor --offline .github/workflows

  lint:secrets:
    desc: Scan git history for committed secrets
    cmds:
      - gitleaks git --no-banner --redact

  test:
    desc: All tests
    cmds:
      - task: test:scripts
      - task: test:go
      - task: test:integration
      - task: test:web

  test:scripts:
    desc: Tests for repo scripts and hooks (node:test)
    cmds:
      - node --test "scripts/test/*.test.mjs"

  test:go:
    desc: Go tests (with the race detector where cgo is available, e.g. Linux CI)
    cmds:
      - |
        if [ -f go.work ]; then
          race=""
          if [ "$(go env CGO_ENABLED)" = "1" ]; then race="-race"; else echo "note: cgo is off, so tests run without -race"; fi
          for d in $(go list -m -f '{{"{{"}}.Dir{{"}}"}}'); do (cd "$d" && go test $race ./...); done
        else
          echo "skip: no Go modules yet (P0-02)"
        fi

  test:integration:
    desc: Go integration tests against Postgres (EARLII_TEST_DATABASE_URL, else the running compose database)
    cmds:
      - |
        url="${EARLII_TEST_DATABASE_URL:-}"
        if [ -z "$url" ]; then
          # Accepting TCP connections, not just "running" (the image's first-run init
          # serves the socket only, then restarts).
          if ! docker compose exec -T postgres pg_isready -h 127.0.0.1 -U earlii -q >/dev/null 2>&1; then
            # CI's integration job passes REQUIRE_DB=1: there, a skip would be a green
            # job that tested nothing.
            if [ "{{.REQUIRE_DB}}" = "1" ]; then
              echo "test:integration: REQUIRE_DB=1 but no test database; set EARLII_TEST_DATABASE_URL" >&2
              exit 1
            fi
            echo "skip: no test database (run task dev:db, or set EARLII_TEST_DATABASE_URL)"
            exit 0
          fi
          # The maintenance database: the tests create and drop their own.
          url="postgres://earlii:earlii-dev-only@127.0.0.1:5432/postgres?sslmode=disable"
        fi
        race=""
        if [ "$(go env CGO_ENABLED)" = "1" ]; then race="-race"; fi
        cd backend && EARLII_TEST_DATABASE_URL="$url" go test $race -tags integration -count=1 ./...

  test:web:
    desc: Web tests
    cmds:
      - |
        if [ -d apps/web ]; then
          pnpm --filter ./apps/web test
        else
          echo "skip: no web app yet (P0-03)"
        fi

  build:web:
    desc: Production web build; fails on a stale route tree or initial JS over budget
    cmds:
      - |
        if [ -d apps/web ]; then
          node scripts/check-web-build.mjs
        else
          echo "skip: no web app yet (P0-03)"
        fi

  gen:
    desc: Regenerate code (sqlc into backend/gen/db)
    cmds:
      - sqlc generate -f backend/sqlc.yaml

  dev:
    desc: Start Postgres and Grafana, migrate, then run the API and the web app (Ctrl-C stops both)
    cmds:
      - task: dev:db
      - task: migrate
      - task: dev:run

  dev:run:
    internal: true
    deps: [dev:api, dev:web]

  dev:db:
    desc: Start the local stack (Postgres on 127.0.0.1:5432, Grafana on http://localhost:3000) and wait until healthy
    cmds:
      - docker compose up -d --wait

  dev:down:
    desc: Stop the local stack (data stays in Docker volumes; add -- -v to wipe it)
    cmds:
      - docker compose down {{.CLI_ARGS}}

  # Variables are set inline, not in env: (Task lets the shell's environment win
  # over env:, so a terminal still holding a prod URL would be used).
  migrate:
    desc: Apply River's and our migrations to the local database
    dir: backend
    cmds:
      - EARLII_ENV=dev EARLII_DATABASE_URL=postgres://earlii:earlii-dev-only@127.0.0.1:5432/earlii?sslmode=disable go run ./cmd/earlii migrate

  dev:web:
    desc: Run the web app on localhost:5173 (proxies /readyz to the API on 127.0.0.1:8080)
    cmds:
      - pnpm --filter ./apps/web dev

  dev:web:lan:
    desc: Like dev:web, but reachable from your phone on the same Wi-Fi (prints the LAN URL)
    cmds:
      - pnpm --filter ./apps/web dev --host

  dev:api:
    desc: Run the API locally on 127.0.0.1:8080, loopback only (Ctrl-C drains and stops it)
    dir: backend
    cmds:
      # Loopback only (BP-001): the web dev proxy reaches it, nobody else on the Wi-Fi does.
      # Inline, like migrate, so the shell's environment can't override it.
      - EARLII_ENV=dev EARLII_HTTP_ADDR=127.0.0.1:8080 EARLII_DATABASE_URL=postgres://earlii:earlii-dev-only@127.0.0.1:5432/earlii?sslmode=disable EARLII_LOG_LEVEL=debug go run ./cmd/earlii api

  handoff:
    desc: Code changed => POINTER changed; new module => HANDBOOK changed
    cmds:
      - node scripts/handoff-check.mjs

  hooks:
    desc: (Re)install git hooks
    cmds:
      - lefthook install
